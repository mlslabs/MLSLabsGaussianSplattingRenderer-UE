[SystemSettings]
; MobileHDR off: the forward pass renders straight into the eye swapchain (no float
; SceneColor + separate tonemap pass). The splat composites write into the post-tonemap
; ViewFamilyTexture either way.
; ForceDepthResolve is only needed where splats are tested against scene depth (the MR composite with
; PureGaussian=0, and the non-MR tile raster); MLSLabsConfigureMobileSceneDepthSampling flips it to 1 at runtime then.
; Do not set r.Mobile.EarlyZPass — it changes the cooked shader-map key (MobFDP).
r.MobileHDR=False
r.MSAACount=1
r.Mobile.AntiAliasing=0
r.Mobile.ForceDepthResolve=0
; MR only: the tile raster composites straight into SceneColor (no offscreen RT, no scene-Z composite).
; Without MR this is ignored: the tile raster skips splats behind the scene depth and blends into SceneColor.
r.MLSLabs.Android.PureGaussian=1
; Draw-cost defaults: scale/foveation/SH cut fill and per-splat work.
r.MLSLabs.Android.NativeRaster.Foveation=3
r.MLSLabs.Android.NativeRaster.ResolutionScale=0.85
r.MLSLabs.Android.NativeRaster.SHDegree=3
r.MLSLabs.Android.NativeRaster.CompactFoveation=1
; MR PureGaussian tile raster resolution relative to the eye viewport (0.25-1); <1 upsamples in the composite.
r.MLSLabs.Android.NativeRaster.TileCompute.Scale=1.0
; Per-tile splat cap of the MR offscreen raster (the others slice instead). The clip's last frames reach ~4700 per body
; tile (2048 left see-through blocks, 512 punched holes); a distant person reaches ~17k and loses its back half to it.
r.MLSLabs.Android.NativeRaster.TileCompute.MaxPerTile=8192
; MR PureGaussian and plain VR raster each tile's front-to-back list in slices of this many splats, in parallel, then
; merge them: every splat is kept and a few heavy tiles no longer serialize the raster. 0 = whole tiles under the cap.
r.MLSLabs.Android.NativeRaster.TileCompute.SliceSplats=2048
; 0 = wait for every pixel in the 16x16 tile to saturate (non-zero leaves translucent cracks).
r.MLSLabs.Android.NativeRaster.TileCompute.EarlySlack=0
; Watermark pass follows the auth policy (0 = never draw).
r.MLSLabs.Watermark=1
; On-screen FPS overlay off. The render call is also commented out.
r.MLSLabs.ShowFPS=0
